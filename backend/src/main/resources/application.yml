spring:
  application:
    name: rpm33
  profiles:
    default: dev
  datasource:
    url: jdbc:postgresql://localhost:5433/33rpm
    username: 33rpm
    password: 33rpm
  jpa:
    hibernate:
      # o esquema é versionado em db/schema.sql; o Hibernate só confere
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        # as associações EAGER da listagem de discos vêm em lote, não uma consulta por disco
        default_batch_fetch_size: 100
        # o reset recarrega o acervo inteiro: linhas de junção e updates vão em lote
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080

app:
  cors:
    # porta do Vite definida em frontend/vite.config.ts
    origem: http://localhost:3300
  # RF0013 e RN0016: a rotina roda todo dia às 03:00; "-" no cron a desliga
  inativacao-automatica:
    cron: "0 0 3 * * *"
    dias-sem-venda: 90
  # RN0044: o bloqueio do carrinho vence prazo-minutos depois da última inclusão, com
  # aviso aviso-minutos antes; a rotina derruba os vencidos a cada intervalo-expiracao
  carrinho:
    prazo-minutos: 15
    aviso-minutos: 5
    intervalo-expiracao: 15s
  # RN0037 e RN0038: a operadora simulada responde depois de espera; a rotina confere os
  # pedidos EM PROCESSAMENTO a cada intervalo
  validacao-pagamento:
    espera: 30s
    intervalo: 10s
  # decisão do grupo, como nos sandboxes de pagamento: estes números são sempre recusados
  operadora:
    cartoes-recusados: "4000000000000002"
